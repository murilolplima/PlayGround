<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2305080d'/%3E%3Cpath d='M13 21h38v7H37v27h-9V28H13z' fill='%23ef5651'/%3E%3C/svg%3E" />
    <title>Tung Tung Sahur: Last Call</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud" aria-live="polite">
      <div>Bundles: <span id="count">5</span></div>
      <div>Threat: <span id="threat">Calm</span></div>
    </div>
    <div id="ui">
      <div id="eyebrow">A FIRST-PERSON NIGHTMARE</div>
      <div id="title">TUNG TUNG SAHUR</div>
      <div id="subtitle">Last Call Before Dawn</div>
      <div id="instructions">Find 5 glowing bundles. Reach the red door. Don't let it catch you.</div>
      <button id="startBtn">Enter the house</button>
      <div id="keyHints">WASD to move <span>•</span> Mouse to look <span>•</span> Shift to run</div>
    </div>
    <div id="messageBox" role="status" hidden>
      <div id="messageText"></div>
    </div>
    <div id="touchControls" aria-label="Movement controls">
      <div class="pad">
        <button data-key="KeyW" class="up" aria-label="Move forward">▲</button>
        <button data-key="KeyA" class="left" aria-label="Move left">◀</button>
        <button data-key="KeyS" class="down" aria-label="Move backward">▼</button>
        <button data-key="KeyD" class="right" aria-label="Move right">▶</button>
      </div>
      <div class="lookHint">Drag to look</div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
